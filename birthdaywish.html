<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magical Birthday Wish</title>
  
  <!-- Canvas Confetti Library (ফায়ারওয়ার্কস ও কনফেটি ইফেক্টের জন্য) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      background: #090a0f;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Glassmorphism Login Box */
    #login {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 40px rgba(255, 0, 128, 0.3);
      color: white;
      z-index: 10;
      transition: all 0.5s ease;
    }

    input {
      padding: 14px 20px;
      width: 240px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      outline: none;
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
      color: #fff;
    }

    button {
      margin-top: 20px;
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff0080, #7928ca);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(255, 0, 128, 0.9);
    }

    #error {
      margin-top: 15px;
      color: #ff4d4d;
      font-weight: bold;
    }

    /* Countdown Screen */
    #countdownScreen {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
    }

    #countdownNumber {
      font-size: 120px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px #ff0080;
      animation: zoomCount 1s ease-in-out infinite;
    }

    @keyframes zoomCount {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* Birthday Main Container */
    #birthday {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
    }

    
    .sub-text {
      font-size: 24px;
      color: #ffffff;
      margin-top: 20px;
      opacity: 0;
      animation: fadeInSub 1.5s ease forwards 1s;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* 6-Second Keyframe Animation Sequence */
    @keyframes wish6Sec {
      0% {
        transform: scale(0.2) rotate(-10deg);
        opacity: 0;
        filter: blur(20px);
      }
      20% {
        transform: scale(1.1) rotate(2deg);
        opacity: 1;
        filter: blur(0px);
      }
      30% {
        transform: scale(1) rotate(0deg);
      }
      85% {
        transform: scale(1.05);
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
        filter: blur(15px);
      }
    }

    @keyframes fadeInSub {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Floating Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Login Card -->
  <div id="login">
    <h2>✨ Enter Passcode</h2>
    <input type="password" id="passInput" placeholder="Enter Code" />
    <br />
    <button onclick="checkPass()">Unlock Surprise</button>
    <div id="error"></div>
  </div>

  <!-- 3-Second Countdown Layer -->
  <div id="countdownScreen">
    <div id="countdownNumber">3</div>
  </div>

  <!-- 6-Second Birthday Wish Container -->
  <div id="birthday">
    <div class="center-content">
      <h1 class="glow-text">HAPPY BIRTHDAY! 🎂</h1>
      <p class="sub-text">Wishing you a life full of love, magic, and endless joy! ✨💖</p>
    </div>
  </div>


  <script src="assets-1/js/script.js"></script>
</body>
</html>
